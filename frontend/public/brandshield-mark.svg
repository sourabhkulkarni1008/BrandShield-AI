<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="16" y1="14" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber Shield Frame -->
  <path d="M24 3L8 9V22C8 31.8 14.8 40.8 24 44C33.2 40.8 40 31.8 40 22V9L24 3Z" 
        stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round" fill="rgba(8, 14, 28, 0.75)" filter="url(#glow)"/>

  <!-- Inner Cyber Tech Nodes -->
  <path d="M24 10L14 14V21C14 27.5 18.2 33.6 24 36.2C29.8 33.6 34 27.5 34 21V14L24 10Z" 
        stroke="url(#shieldGrad)" stroke-width="1.2" stroke-dasharray="2 2" fill="none" opacity="0.6"/>

  <!-- Central AI Core Emblem -->
  <polygon points="24,14 31,23 24,32 17,23" fill="url(#coreGrad)" opacity="0.9"/>
  <circle cx="24" cy="23" r="3.5" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Neural Data Circuits -->
  <path d="M24 6V10 M24 36V41 M11 16L14 18 M37 16L34 18 M16 29L19 28 M32 29L29 28" 
        stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
</svg>